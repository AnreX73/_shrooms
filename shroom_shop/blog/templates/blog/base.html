{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
   <title>{% block title %}Лесная фея{% endblock %}</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="referrer" content="origin">
    {% comment %} <link rel="shortcut icon" href="{{favicon.image.url}}"/> {% endcomment %}
    <link rel="stylesheet" href="{% static 'shop/css/main.css' %}">
    <link rel="stylesheet" href="{% static 'blog/css/blog.css' %}">
    <link rel="stylesheet" href="{% static 'blog/css/splide.min.css' %}">
    <link rel="stylesheet" href="{% static 'shop/css/dropzone.min.css' %}">
    <style>[x-cloak] { display: none !important; }</style>
    {% block extra_css %}{% endblock %}
</head>
<body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>    

  
    
    
{% block content %}


{% endblock content %}


<script  src="{% static 'blog/js/script.js' %}"></script>
<script  src="{% static 'shop/js/alpine.js' %}"></script>
<script src="{% static 'shop/js/htmx.min.js' %}"></script>
<script  src="{% static 'blog/js/splide.min.js' %}"></script>
<script  src="{% static 'shop/js/dropzone.min.js' %}"></script>
<script  src="{% static 'shop/js/sortable.min.js' %}"></script>
{% comment %} <script  src="{% static 'shop/js/main.js' %}"></script> {% endcomment %}
<script src="{% static 'blog/js/dropzone-init.js' %}"></script>
<script src="{% static 'blog/js/block-sortable.js' %}"></script>
{% block extra_js %}{% endblock %} 
</body>
</html>
