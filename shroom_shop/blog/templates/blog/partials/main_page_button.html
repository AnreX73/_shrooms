<div id="main-page-toggle-{{ post.pk }}">
    {% if post.published_on_main_page %}
        <button type="button"
                class="btn-active"
                hx-get="{% url 'blog:main_page_confirm' post.pk %}"
                hx-target="#modal-container"
                hx-swap="innerHTML">
            ✓ Показывается на главной
        </button>
    {% else %}
        <button type="button"
                hx-get="{% url 'blog:main_page_confirm' post.pk %}"
                hx-target="#modal-container"
                hx-swap="innerHTML">
            Показать на главной
        </button>
    {% endif %}
</div>
