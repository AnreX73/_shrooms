<div id="main-page-toggle-{{ post.pk }}">
    {% if post.published_on_main_page %}
        <button type="button"
                class="btn-active"
                hx-get="{% url 'blog:main_page_confirm' post.pk %}"
                hx-target="#modal-container"
                hx-swap="innerHTML">
            ✓ На главной{% if main_page_limit %} ({{ main_page_count }} из {{ main_page_limit }}){% endif %}
        </button>
    {% else %}
        <button type="button"
                hx-get="{% url 'blog:main_page_confirm' post.pk %}"
                hx-target="#modal-container"
                hx-swap="innerHTML">
            Показать на главной{% if main_page_limit %} ({{ main_page_count }} из {{ main_page_limit }}){% endif %}
        </button>
    {% endif %}
    {% if error %}
        <p class="main-page-error">{{ error }}</p>
    {% endif %}
</div>
