{% extends "shop/base.html" %}
{% load static %}

{% block title %}Blog{% endblock %}

{% block content %}
    <h1>Blog</h1>
    <div class="row">
        {% for post in posts %}
            <div class="col-md-4">
                <h3>{{ post.title }}</h3>
                <p>{{ post.excerpt }}</p>
                <a href="{% url 'blog:post_detail' slug=post.slug %}" class="users-btn profile_logaut_btn">Read More</a>
                <a href="{% url 'blog:post_edit' pk=post.id %}" class="users-btn profile_logaut_btn">Редактировать пост</a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
