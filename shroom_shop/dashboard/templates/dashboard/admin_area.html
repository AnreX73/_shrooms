{% extends 'dashboard/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1 style="text-align: center;">Панель администратора</h1>
 

 {% comment %} <div class="admin_buttons_panel">
  
  <input type="button" class="order_action_btn"value="На главную" onclick="window.location.href='{% url 'shop:index' %}'">
 <div x-data="{ unread: 0 }" 
     x-init="
         const poll = async () => {
             const res = await fetch('/notifications/chat/unread-count/');
             const data = await res.json();
             unread = data.count;
         };
         poll();
         setInterval(poll, 10000);
     "
     style="position:relative; display:inline-block;">
    
    <input type="button" class="order_action_btn" value="💬 Чат с клиентами"
           onclick="window.location.href='{% url 'dashboard:chat_list' %}'">
    
    <span x-show="unread > 0"
          x-text="unread"
          style="
              position:absolute; top:3px; right:3px;
              background:red; color:#fff; border-radius:50%;
              width:20px; height:20px; font-size:11px;
             padding:3px;
              pointer-events:none; text-align:center;
          ">
    </span>
</div> {% endcomment %}


<div class="admin_buttons_panel">
    <div class="admin_btns_block">
            <h3 class="btns_block_title">Работа с товарами</h3>
            <hr>
  <input type="button" class="users-btn profile_logaut_btn" value="Добавить товар" onclick="window.location.href='{% url 'dashboard:product_create' %}'">
  <input type="button" class="users-btn profile_logaut_btn" value="Поиск товара по артикулу" onclick="window.location.href='{% url 'dashboard:product_search' %}'">
  <input type="button" class="users-btn profile_logaut_btn" value="Сделать клон товара" onclick="window.location.href='{% url 'shop:catalog' %}'">
  <input type="button" class="users-btn profile_logaut_btn" value="Редактировать товар" onclick="window.location.href='{% url 'shop:catalog' %}'">
    </div>


    <div class="admin_btns_block">
            <h3 class="btns_block_title">Загрузки</h3>
            <hr>
            <input type="button" class="users-btn profile_logaut_btn" value="Цены и скидки" onclick="window.location.href='{% url 'dashboard:price_sync' %}'"> 
            <input type="button" class="users-btn profile_logaut_btn" value="Сихронизация остатков" onclick="window.location.href='{% url 'dashboard:stock_sync' %}'">
    </div>
    <div class="admin_btns_block">
            <h3 class="btns_block_title">Управление заказами</h3>
            <hr>
            <input type="button" onclick="window.location.href='{% url 'dashboard:manage_orders' %}'" class="users-btn profile_logaut_btn" value="Управление заказами">
    </div>
    <div class="admin_btns_block">
            <h3 class="btns_block_title">Работа с пользователями</h3>
            <hr>       
    </div>
    
</div>
<hr>
<div class="admin_nav_btns">
<input type="button" onclick="window.location.href='{% url 'shop:index' %}'" class="users-btn profile_logaut_btn" value="На главную">
        <form method="post" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button class="users-btn profile_logaut_btn" type="submit">Выйти</button>
        </form>
</div>
{% endblock %}
