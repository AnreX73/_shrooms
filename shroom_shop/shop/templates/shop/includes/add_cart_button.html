
<button class="add-to-cart-btn"
        {% if product.stock == 0 %}disabled{% endif %}
         x-data="{ 
        isAuth: {{ user.is_authenticated|yesno:'true,false' }},
        handleCart() {
            if (!this.isAuth) return alert('Нужно авторизоваться!');
            
            htmx.ajax('POST', '{% url 'shop:toggle_cart' product.id %}', {
                values: { is_cart: true },
                swap: 'none'
            });
        }
    }"
    @click.prevent="handleCart">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
                <!-- Ручка -->
                <path d="M 20 28 A 12 12 0 0 1 44 28" 
                        stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
                <!-- Обodok -->
                <rect x="4" y="26" width="56" height="6" rx="3" fill="#fff"/>
                <!-- Чаша корзины -->
                <path d="M 6 32 L 58 32 A 26 22 0 0 1 6 32 Z" fill="#fff"/>
                </svg>
            <p>В корзину</p>
            
            
        </button>
