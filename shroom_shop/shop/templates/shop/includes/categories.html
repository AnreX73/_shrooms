 <!-- Categories Section -->
    <section class="categories" id="categories">
        
            <div class="section-title">
                <h2 style="text-align: center;margin-bottom: 20px; margin-top: 20px;">Категории товаров</h2>
                
            </div>
            <div class="categories-grid">
                {% for category in categories %}
                <a href="{{ category.get_absolute_url }}" class="category-card">
                    {% if category.image %}<img src="{{ category.image.url }}" alt="{{ category.name }}" class="category-img">{% endif %}
                    <div class="category-overlay">
                        <h3 class="category_name">{{ category.name }}</h3>
                        {{ category.description|safe }}
                    </div>
                </a>
                {% endfor %}              
            </div>
       
    </section>
